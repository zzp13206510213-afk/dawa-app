<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数字大外</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A45">
<meta name="description" content="数字大外 · 校园活动与通知聚合 App">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数字大外">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --p:#FF7A45;
  --p2:color-mix(in srgb,var(--p) 72%,#FFFFFF);
  --cover-a:color-mix(in srgb,var(--p) 58%,#FFC978);
  --cover-b:color-mix(in srgb,var(--p) 72%,#E0407E);
  --blue:#4A90E2;--teal:#2FBF9B;--green:#34C77B;--purple:#8B7BF0;--yellow:#FFC53D;--clay:#E0A34A;
  --bg:#F4F6FA;--card:#FFFFFF;--fg:#1B1D23;--fg2:#6E7683;--fg3:#9BA2AE;
  --line:#EBEEF4;--chip:#F1F4F9;
  --bar-bg:rgba(255,255,255,.90);--bar-pill:#E9ECF2;--bar-border:rgba(23,32,54,.08);--bar-shadow:0 12px 30px rgba(23,32,54,.16);
  --r:18px;
  --p-soft:color-mix(in srgb,var(--p) 13%,var(--card));
  --shadow:0 10px 24px rgba(23,32,54,.06);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0E1116;--card:#171B21;--fg:#EDF0F5;--fg2:#98A0AC;--fg3:#7C848F;
  --line:#242A33;--chip:#212831;--shadow:0 10px 24px rgba(0,0,0,.35);
  --bar-bg:rgba(28,30,36,.90);--bar-pill:#35383F;--bar-border:rgba(255,255,255,.08);--bar-shadow:0 14px 34px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;--card:#171B21;--fg:#EDF0F5;--fg2:#98A0AC;--fg3:#7C848F;
    --line:#242A33;--chip:#212831;--shadow:0 10px 24px rgba(0,0,0,.35);
    --bar-bg:rgba(28,30,36,.90);--bar-pill:#35383F;--bar-border:rgba(255,255,255,.08);--bar-shadow:0 14px 34px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);overscroll-behavior:none;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;width:100%}
a{color:inherit;text-decoration:none}

/* ---------- shell ---------- */
#app{position:relative;max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
[hidden]{display:none!important}
/* 视口层负责裁剪（不参与位移），轨道层负责滑动 */
#viewport{flex:1;min-height:0;overflow:hidden;position:relative}
#screens{
  display:flex;flex-direction:row;width:100%;height:100%;touch-action:pan-y;
  transition:transform .36s cubic-bezier(.32,.72,0,1);will-change:transform;
}
.screen{
  flex:0 0 100%;max-width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:pan-y;
  padding-top:var(--safe-t);padding-bottom:calc(84px + var(--safe-b));
  transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .34s;
}
.screen[hidden]{display:none}
.wrap{padding:0 18px}

/* ---------- bottom tabs（Instagram 悬浮胶囊栏：纯图标 + 滑动高亮块） ---------- */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:20;
  display:flex;align-items:stretch;justify-content:space-around;
  height:58px;padding:6px;border-radius:999px;
  background:var(--bar-bg);border:1px solid var(--bar-border);box-shadow:var(--bar-shadow);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .34s;
}
.tab-ind{
  position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/4);
  border-radius:999px;background:var(--bar-pill);z-index:0;
  transition:transform .4s cubic-bezier(.34,1.28,.36,1);
}
.tab-ind.no-anim{transition:none}
.tab{flex:1;display:grid;place-items:center;position:relative;z-index:1;color:var(--fg3);border-radius:999px;transition:color .24s}
.tab .ico{width:26px;height:26px;stroke-width:1.85;transition:transform .2s}
.tab:active .ico,.tab:active .tab-av{transform:scale(.9)}
.tab.on{color:var(--fg)}
.tab .tab-lb{display:none;font-size:calc(10.5 * var(--tt, 1) * 1px)}
.tab-av{
  width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:calc(15 * var(--tt, 1) * 1px);color:#fff;opacity:.5;
  background:linear-gradient(140deg,#FFB884,#FF7A45);
  box-shadow:0 0 0 2px transparent;transition:opacity .2s,box-shadow .2s,transform .2s;
}
.tab.on .tab-av{opacity:1;box-shadow:0 0 0 2px var(--p)}
.tab-badge{
  position:absolute;top:7px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:#FF4D4F;color:#fff;font-size:calc(10 * var(--tt, 1) * 1px);
  font-weight:600;display:grid;place-items:center;border:1.5px solid var(--card);
}
@keyframes tabBounce{0%{transform:scale(1)}28%{transform:scale(.84)}62%{transform:scale(1.12)}100%{transform:scale(1)}}
.tab.bounce .ico,.tab.bounce .tab-av{animation:tabBounce .44s cubic-bezier(.3,.8,.4,1)}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.tab-badge.pulse{animation:badgePulse .5s cubic-bezier(.3,.8,.4,1)}
/* 想恢复「图标 + 文字」的老样式：给 #app 加上 show-tab-labels 即可 */
#app.show-tab-labels .tabbar{height:66px;padding:4px}
#app.show-tab-labels .tab-ind{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4)}
#app.show-tab-labels .tab{display:flex;flex-direction:column;gap:3px}
#app.show-tab-labels .tab .tab-lb{display:block}

/* ---------- icons ---------- */
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ico-sm{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.chev{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--fg3);flex:0 0 auto}

/* ---------- atoms ---------- */
.row{display:flex;align-items:center}
.spacer{flex:1}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:calc(11 * var(--tt, 1) * 1px);font-weight:500;background:var(--p-soft);color:var(--p);white-space:nowrap}
.pill.blue{background:color-mix(in srgb,var(--blue) 14%,var(--card));color:var(--blue)}
.pill.green{background:color-mix(in srgb,var(--green) 15%,var(--card));color:var(--green)}
.pill.grey{background:var(--chip);color:var(--fg2)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#FF4D4F;color:#fff;font-size:calc(10.5 * var(--tt, 1) * 1px);font-weight:600;display:inline-grid;place-items:center}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:0 0 auto;overflow:hidden}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 0}
.sec-head b{font-size:calc(16.5 * var(--tt, 1) * 1px);font-weight:600}
.sec-head span{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}
.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.divider{height:1px;background:var(--line);margin:2px 14px}
.empty{padding:40px 20px;text-align:center;color:var(--fg3);font-size:calc(13 * var(--tt, 1) * 1px)}

/* ---------- 设置类控件 ---------- */
.field{display:flex;align-items:center;gap:10px;padding:12px 15px;min-height:50px}
.field+.field,.field+.fieldcol,.fieldcol+.field{border-top:1px solid var(--line)}
.field-lb{font-size:calc(13.5 * var(--tt, 1) * 1px);flex:0 0 auto;color:var(--fg)}
.field .spacer{flex:1}
.field input{text-align:right;font-size:calc(13.5 * var(--tt, 1) * 1px);color:var(--fg)}
.field input::placeholder{color:var(--fg3)}
.field-val{font-size:calc(13 * var(--tt, 1) * 1px);color:var(--fg2);text-align:right}
.fieldcol{display:flex;flex-direction:column;gap:7px;padding:13px 15px}
.fieldcol textarea{font-size:calc(13.5 * var(--tt, 1) * 1px);resize:none;line-height:1.5;min-height:44px;color:var(--fg)}
.fieldcol textarea::placeholder{color:var(--fg3)}
.count{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg3);text-align:right}
.field-pick{width:100%;text-align:left}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:28px;border-radius:10px;font-size:calc(12 * var(--tt, 1) * 1px);color:var(--fg2);transition:.18s}
.seg button.on{background:var(--card);color:var(--fg);font-weight:500;box-shadow:0 2px 6px rgba(23,32,54,.08)}
.opt{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt:last-of-type{border-bottom:0}
.opt-tx{flex:1}
.opt-tx b{display:block;font-size:calc(14 * var(--tt, 1) * 1px);font-weight:500}
.opt-tx span{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}
.opt .tick{width:20px;height:20px;border-radius:50%;background:var(--p);display:grid;place-items:center;flex:0 0 auto;opacity:0}
.opt.on .tick{opacity:1}
.opt .tick svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.opt[disabled]{opacity:.5}
.avatar-edit{position:relative}
.avatar-edit i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--p);display:grid;place-items:center;border:2px solid var(--card);color:#fff}
.avatar-edit i svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.emo-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:14px 0 4px}
.emo-pick button{aspect-ratio:1;border-radius:13px;background:var(--chip);display:grid;place-items:center;font-size:calc(22 * var(--tt, 1) * 1px)}
.emo-pick button.on{background:var(--p-soft);outline:2px solid var(--p)}
.done-bar{margin-top:14px}
.done-bar .txt{display:flex;align-items:baseline;justify-content:space-between;font-size:calc(12 * var(--tt, 1) * 1px);color:var(--fg2)}
.done-bar .txt b{font-size:calc(15 * var(--tt, 1) * 1px);color:var(--fg);font-weight:600}
.track{margin-top:8px;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p2),var(--p));transition:width .4s}
.note{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3);line-height:1.7}
.banner-tip{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:14px;background:var(--p-soft);color:var(--p);font-size:calc(12 * var(--tt, 1) * 1px)}
.banner-tip .spacer{flex:1}
.banner-tip button{font-size:calc(12 * var(--tt, 1) * 1px);font-weight:600;color:var(--p);text-decoration:underline}
.page-foot{flex:0 0 auto;display:flex;gap:10px;padding:10px 16px calc(10px + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
.btn-main{flex:1;height:46px;border-radius:14px;background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;font-size:calc(14.5 * var(--tt, 1) * 1px);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 18px color-mix(in srgb,var(--p) 34%,transparent)}
.btn-main:active{transform:scale(.98)}
.btn-sub{height:46px;padding:0 18px;border-radius:14px;background:var(--chip);color:var(--fg2);font-size:calc(14 * var(--tt, 1) * 1px);display:flex;align-items:center;justify-content:center}
.tagdot{width:6px;height:6px;border-radius:50%;background:var(--p);flex:0 0 auto}

/* ---------- 极速模式 ---------- */
#app.lite .tabbar,#app.lite .navbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card)}
#app.lite .card,#app.lite .post,#app.lite .mini,#app.lite .act-card,#app.lite .info,#app.lite .stats{box-shadow:none}
#app.lite .cover:before,#app.lite .cover:after{display:none}
#app.lite *{transition:none!important;animation:none!important}

/* ---------- top search bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px 0}
.search{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg3);font-size:calc(13 * var(--tt, 1) * 1px);box-shadow:var(--shadow)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.93)}
.dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:#FF4D4F;border:1.5px solid var(--card)}

/* ---------- home ---------- */
.banner{margin:12px 18px 0;display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:16px;background:linear-gradient(120deg,var(--cover-a),var(--p));color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--p) 32%,transparent);transition:transform .15s}
.banner:active{transform:scale(.985)}
.banner-ico{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:calc(15 * var(--tt, 1) * 1px)}
.banner-tx{flex:1;display:flex;flex-direction:column;gap:2px}
.banner-tx b{font-size:calc(13.5 * var(--tt, 1) * 1px);font-weight:600}
.banner-tx span{font-size:calc(11.5 * var(--tt, 1) * 1px);opacity:.92}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 2px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile-sq{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;box-shadow:0 6px 14px rgba(23,32,54,.08);transition:transform .15s;font-size:calc(27 * var(--tt, 1) * 1px)}
.tile.on .tile-sq{outline:2.5px solid var(--p);outline-offset:2px}
.tile:active .tile-sq{transform:scale(.95)}
.tile-lb{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg2)}
.feed{padding:0 18px}
.post{margin-top:14px;padding:14px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.post-head{display:flex;align-items:center;gap:9px}
.post-av{width:36px;height:36px;font-size:calc(17 * var(--tt, 1) * 1px)}
.post-nm{flex:1;min-width:0}
.post-nm b{display:block;font-size:calc(13.5 * var(--tt, 1) * 1px);font-weight:600}
.post-nm span{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg3)}
.follow{display:flex;align-items:center;gap:3px;height:27px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--p) 45%,transparent);color:var(--p);font-size:calc(12 * var(--tt, 1) * 1px);font-weight:500;transition:.15s}
.follow:active{transform:scale(.95)}
.follow.on{border-color:var(--line);color:var(--fg3)}
.post-tx{margin-top:9px;font-size:calc(13 * var(--tt, 1) * 1px);line-height:1.62;white-space:pre-wrap}
.grid6{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid6>*{height:86px;border-radius:11px;display:grid;place-items:center;font-size:calc(29 * var(--tt, 1) * 1px);transition:transform .15s}
.grid6>*:active{transform:scale(.97)}
.post-act{margin-top:10px;display:flex;align-items:center;gap:16px;font-size:calc(12 * var(--tt, 1) * 1px);color:var(--fg2)}
.post-act .act{display:flex;align-items:center;gap:5px;transition:.15s}
.post-act .act:active{transform:scale(.94)}
.post-act .act.on{color:#FF4D5E;font-weight:500}
.post-act .act.on .ico-sm{fill:currentColor}
.mini{margin-top:12px;padding:12px 13px;display:flex;align-items:center;gap:11px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.mini-sq{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:calc(19 * var(--tt, 1) * 1px)}
.mini-tx{flex:1;min-width:0}
.mini-tx b{display:block;font-size:calc(13.5 * var(--tt, 1) * 1px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tx span{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}

/* ---------- app grid (主界面) ---------- */
.app-hero{padding:8px 18px 0}
.app-title{display:flex;align-items:center;gap:8px}
.app-title h1{font-size:calc(22 * var(--tt, 1) * 1px);font-weight:600;letter-spacing:.2px}
.app-sub{margin-top:6px;font-size:calc(12 * var(--tt, 1) * 1px);color:var(--fg2)}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0;padding:16px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.app:active{transform:scale(.94)}
.app-tile{position:relative;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 16px rgba(23,32,54,.14)}
.app-tile .badge{position:absolute;top:-5px;right:-6px;border:1.5px solid var(--card)}
.app-tile .ico{width:24px;height:24px}
.app span{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg2)}
.card-hd{display:flex;align-items:center;gap:7px;padding:12px 14px 8px}
.card-hd b{font-size:calc(14.5 * var(--tt, 1) * 1px);font-weight:600}
.card-hd .more{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}
.mail{display:flex;align-items:center;gap:10px;padding:8px 14px;transition:background .15s}
.mail:active{background:var(--chip)}
.mail-ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:calc(15 * var(--tt, 1) * 1px);flex:0 0 auto}
.mail-tx{flex:1;min-width:0}
.mail-tx b{display:flex;align-items:center;gap:5px;font-size:calc(13 * var(--tt, 1) * 1px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-tx b i{width:6px;height:6px;border-radius:50%;background:#FF4D4F;flex:0 0 auto;display:inline-block}
.mail-tx span{display:block;font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-t{font-size:calc(10.5 * var(--tt, 1) * 1px);color:var(--fg3);flex:0 0 auto}
.todo{display:flex;align-items:center;gap:10px;padding:10px 14px;transition:opacity .2s}
.box{width:20px;height:20px;border-radius:7px;border:1.6px solid color-mix(in srgb,var(--fg) 28%,transparent);flex:0 0 auto;display:grid;place-items:center;transition:.15s}
.box.on{background:var(--p);border-color:var(--p)}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.box.on svg{opacity:1}
.todo-tx{flex:1;min-width:0}
.todo-tx b{display:block;font-size:calc(13 * var(--tt, 1) * 1px);font-weight:500}
.todo-tx span{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--p)}
.todo-tx span.dim{color:var(--fg3)}
.todo.done .todo-tx b{text-decoration:line-through;color:var(--fg3)}
.todo-add{display:flex;align-items:center;gap:9px;padding:10px 14px}
.todo-add input{font-size:calc(13 * var(--tt, 1) * 1px)}
.todo-add input::placeholder{color:var(--fg3)}

/* ---------- activity list (发现) ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;font-size:calc(12.5 * var(--tt, 1) * 1px);color:var(--fg2);transition:.15s}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:500}
.act-list{padding:0 18px}
.act-card{margin-top:12px;padding:13px;display:flex;gap:12px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.act-card:active{transform:scale(.985)}
.act-emo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:calc(26 * var(--tt, 1) * 1px);flex:0 0 auto}
.act-bd{flex:1;min-width:0}
.act-bd h3{font-size:calc(14 * var(--tt, 1) * 1px);font-weight:600;line-height:1.35}
.act-bd .meta{margin-top:5px;font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg2);display:flex;align-items:center;gap:5px}
.act-bd .meta+.meta{margin-top:3px}
.act-foot{margin-top:8px;display:flex;align-items:center;gap:8px}
.progress-mini{flex:1;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.progress-mini i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p2),var(--p))}

/* ---------- activity detail ---------- */
.cover{position:relative;padding:calc(6px + var(--safe-t)) 18px 0;background:linear-gradient(150deg,var(--cover-a) 0%,var(--p) 48%,var(--cover-b) 100%);color:#fff;overflow:hidden}
.cover:after{content:"";position:absolute;right:-46px;top:-30px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14)}
.cover:before{content:"";position:absolute;right:26px;bottom:-56px;width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.1)}
.cover-top{position:relative;z-index:2;display:flex;align-items:center;gap:8px;height:44px}
.cbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px);transition:transform .15s}
.cbtn:active{transform:scale(.92)}
.cover-body{position:relative;z-index:2;padding:18px 72px 26px 0}
.cover-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.24);font-size:calc(11 * var(--tt, 1) * 1px);font-weight:500}
.cover-body h2{margin-top:12px;font-size:calc(23 * var(--tt, 1) * 1px);line-height:1.3;font-weight:600;letter-spacing:.2px}
.cover-body p{margin-top:8px;font-size:calc(12 * var(--tt, 1) * 1px);opacity:.92}
.cover-emo{position:absolute;right:20px;bottom:20px;font-size:calc(54 * var(--tt, 1) * 1px);opacity:.85;z-index:1}
.info{margin:-26px 18px 0;position:relative;z-index:3;padding:14px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:0 14px 28px rgba(23,32,54,.1)}
.info-row{display:flex;align-items:center;gap:8px;font-size:calc(13 * var(--tt, 1) * 1px)}
.info-row+.info-row{margin-top:9px}
.info-row .ico-sm{color:var(--p)}
.bar-wrap{margin-top:13px}
.bar-tx{display:flex;align-items:baseline;justify-content:space-between;font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg2)}
.bar-tx b{font-size:calc(13 * var(--tt, 1) * 1px);color:var(--fg);font-weight:600}
.bar{margin-top:7px;height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p2),var(--p));transition:width .5s cubic-bezier(.32,.72,0,1)}
.deadline{margin-top:12px;display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:12px;background:var(--p-soft);color:var(--p);font-size:calc(12 * var(--tt, 1) * 1px);font-weight:500}
.deadline.ok{background:color-mix(in srgb,var(--green) 14%,var(--card));color:var(--green)}
.stats{margin:12px 18px 0;display:flex;align-items:center;padding:13px 14px;gap:12px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.stat{display:flex;align-items:center;gap:5px;font-size:calc(12 * var(--tt, 1) * 1px);font-weight:500;transition:.15s;flex:0 0 auto}
#app .stats .pill{font-size:calc(10.5 * var(--tt, 1) * 1px);padding:4px 8px;overflow:hidden;text-overflow:ellipsis;max-width:126px;flex:0 1 auto}
.stat:active{transform:scale(.94)}
.stat.on{color:#FF4D5E}
.stat.on .ico-sm{fill:currentColor;stroke:currentColor}
.ghost{flex:1;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;font-size:calc(12.5 * var(--tt, 1) * 1px);box-shadow:var(--shadow);transition:transform .15s}
.ghost:active{transform:scale(.97)}
.cmt-hd{display:flex;align-items:baseline;gap:8px;padding:16px 18px 0}
.cmt-hd b{font-size:calc(14.5 * var(--tt, 1) * 1px);font-weight:600}
.cmt-hd span{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}
.cmt{display:flex;gap:10px;padding:12px 18px 0}
.cmt-av{width:32px;height:32px;font-size:calc(14 * var(--tt, 1) * 1px)}
.cmt-bd{flex:1;min-width:0}
.cmt-bd b{font-size:calc(12.5 * var(--tt, 1) * 1px);font-weight:600;color:var(--fg2)}
.cmt-bd p{margin-top:3px;font-size:calc(12.5 * var(--tt, 1) * 1px);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cmt-bd .sub{margin-top:5px;font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg3);display:flex;align-items:center;gap:12px}
.actionbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 16px calc(8px + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
.cmt-input{flex:1;height:40px;border-radius:999px;background:var(--chip);color:var(--fg3);font-size:calc(12.5 * var(--tt, 1) * 1px);display:flex;align-items:center;gap:7px;padding:0 13px;transition:.15s}
.cmt-input input{font-size:calc(16 * var(--tt, 1) * 1px)}
.cta{height:40px;padding:0 18px;border-radius:999px;background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;font-size:calc(13 * var(--tt, 1) * 1px);font-weight:600;display:flex;align-items:center;gap:5px;box-shadow:0 8px 18px color-mix(in srgb,var(--p) 40%,transparent);transition:transform .15s;white-space:nowrap}
.cta:active{transform:scale(.95)}
.cta.done{background:var(--chip);color:var(--fg2);box-shadow:none}

/* ---------- profile ---------- */
.prof{position:relative;padding:6px 18px 0}
.prof:before{content:"";position:absolute;left:0;right:0;top:-120px;height:290px;background:linear-gradient(160deg,color-mix(in srgb,var(--p) 22%,transparent),transparent 72%);z-index:0}
.prof>*{position:relative;z-index:1}
.prof-top{display:flex;align-items:center;gap:13px;padding-top:8px}
.prof-av{width:62px;height:62px;font-size:calc(28 * var(--tt, 1) * 1px);background:linear-gradient(140deg,#FFB884,#FF7A45);box-shadow:0 10px 22px rgba(255,122,69,.32)}
.prof-nm{flex:1;min-width:0}
.prof-nm h2{font-size:calc(19 * var(--tt, 1) * 1px);font-weight:600}
.prof-nm .id{margin-top:4px;font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg2)}
.prof-nm .pill{margin-top:7px}
.prof-stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);padding:11px 0;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.prof-stats button{text-align:center;position:relative;transition:transform .15s}
.prof-stats button:active{transform:scale(.95)}
.prof-stats button+button:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.prof-stats b{display:block;font-size:calc(16 * var(--tt, 1) * 1px);font-weight:600}
.prof-stats span{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg3)}
.prof-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;padding:16px 6px}
.pg{display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .15s}
.pg:active{transform:scale(.94)}
.pg-i{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 16px rgba(23,32,54,.14)}
.pg-i .ico{width:23px;height:23px}
.pg span{font-size:calc(11 * var(--tt, 1) * 1px);color:var(--fg2)}
.pg .badge{position:absolute;top:-5px;right:-6px;border:1.5px solid var(--card)}
.list{padding:6px 0}
.li{display:flex;align-items:center;gap:11px;padding:10px 15px;width:100%;transition:background .15s}
.li:active{background:var(--chip)}
.li-ico{width:22px;height:22px;color:var(--fg2);display:grid;place-items:center}
.li-tx{flex:1;font-size:calc(13.5 * var(--tt, 1) * 1px);text-align:left}
.li-hint{font-size:calc(11.5 * var(--tt, 1) * 1px);color:var(--fg3)}
.li.out .li-ico,.li.out .li-tx{color:var(--fg3)}

/* ---------- pushed page ---------- */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:30;transform:translateX(100%);transition:transform .34s cubic-bezier(.32,.72,0,1),box-shadow .34s;box-shadow:-8px 0 24px rgba(0,0,0,.06);will-change:transform}
.page.in{transform:none}
.page.behind{transform:translateX(-17%) scale(.965);opacity:.72;box-shadow:none}
.page.anim .page-scroll,.page.anim .actionbar{animation:pageIn .34s cubic-bezier(.32,.72,0,1)}
@keyframes pageIn{from{opacity:0}}
/* 打开子页面时，底下的主界面跟着往左退一点（iOS / Instagram 的推入感） */
#app.pushed .screen[data-on],#app.pushed #tabbar{transform:translateX(-15%);opacity:.62}
.navbar{transition:box-shadow .3s}
.page.in .navbar{box-shadow:0 6px 18px rgba(15,23,42,.04)}
.page-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.navbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 16px 8px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.navbar h2{flex:1;font-size:calc(16 * var(--tt, 1) * 1px);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .icon-btn{width:34px;height:34px;border-radius:12px;box-shadow:none}
.nb-ghost{width:34px;flex:0 0 auto}

/* ---------- overlays ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(15,18,24,.42);backdrop-filter:blur(2px);animation:fade .2s}
.sheet{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + var(--safe-b));animation:up .28s cubic-bezier(.32,.72,0,1);max-height:82%;overflow-y:auto}
.sheet-h{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-size:calc(16 * var(--tt, 1) * 1px);font-weight:600;margin-bottom:6px}
.sheet p{font-size:calc(13 * var(--tt, 1) * 1px);color:var(--fg2)}
.sheet-btn{width:100%;height:48px;border-radius:14px;background:linear-gradient(120deg,var(--p2),var(--p));color:#fff;font-size:calc(14.5 * var(--tt, 1) * 1px);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px}
.sheet-btn.ghostbtn{background:var(--chip);color:var(--fg);font-weight:500}
.toast{position:absolute;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:80;background:rgba(24,28,36,.94);color:#fff;font-size:calc(12.5 * var(--tt, 1) * 1px);padding:10px 16px;border-radius:999px;max-width:82%;text-align:center;animation:up .22s;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.lightbox{position:absolute;inset:0;z-index:90;background:rgba(8,10,14,.94);display:grid;place-items:center;animation:fade .2s}
.lightbox div{font-size:calc(110 * var(--tt, 1) * 1px)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--chip);position:relative;transition:.2s;flex:0 0 auto;border:1px solid var(--line)}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--p);border-color:var(--p)}
.switch.on i{left:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:.6}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
.toast{animation:toastIn .26s cubic-bezier(.2,.8,.3,1.2)}
@keyframes zoomIn{from{opacity:0;transform:scale(.86)}}
.lightbox>div{animation:zoomIn .3s cubic-bezier(.2,.8,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.anim-in .post,.anim-in .mini,.anim-in .act-card,.anim-in .mail,.anim-in .todo{animation:cardIn .44s cubic-bezier(.32,.72,0,1) both}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.38)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.pop .ico-sm{animation:heartPop .46s cubic-bezier(.3,.8,.4,1)}
.pop{color:#FF4D5E}
@keyframes flashOk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 50%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.flash{animation:flashOk .8s ease-out}
.cmt-new{animation:cardIn .42s cubic-bezier(.32,.72,0,1);border-radius:12px;background:var(--p-soft);margin-left:10px;margin-right:10px;padding-left:8px;padding-right:8px}
@keyframes screenInR{from{opacity:0;transform:translateX(18px)}}
@keyframes screenInL{from{opacity:0;transform:translateX(-18px)}}
.screen.enter-r{animation:screenInR .3s cubic-bezier(.32,.72,0,1)}
.screen.enter-l{animation:screenInL .3s cubic-bezier(.32,.72,0,1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

  <div id="overlays"></div>
</div>

/* 只更新状态，不重建节点——这样高亮块能顺着滑过去而不是瞬间跳过去 */
function syncTabbar() {
  TABS.forEach(function (t) {
    var btn = $('.tab[data-k="' + t.k + '"]');
    if (!btn) return;
    var on = t.k === active;
    var lb = L(t.lb, t.en);

    var ic = btn.querySelector(".tab-ic");
    var glyph = t.k === "me" ? '<span class="tab-av">' + ME.emoji + "</span>" : ico(on ? t.i + "Fill" : t.i);
    if (ic && ic.innerHTML !== glyph) ic.innerHTML = glyph;
  });

function moveIndicator(p) {

function idxOf(k) {

function switchTo(idx, opts) {
  idx = Math.max(0, Math.min(TABS.length - 1, idx));
  var k = TABS[idx].k;
  var prev = active;
  var cur = $('.screen[data-k="' + prev + '"]');
  if (cur) scrollMem[active] = cur.scrollTop;
  active = k;
  var moved = prev !== k;
  drawTab(k, moved || !(opts && opts.silent));
  var el = $('.screen[data-k="' + k + '"]');
  if (el) el.scrollTop = scrollMem[k] || 0;
  $$(".screen").forEach(function (s) {
    if (s.dataset.k === k) s.dataset.on = "1"; else delete s.dataset.on;
  });
  setTrack(idx, 0, true);
  syncTabbar();
  if (moved) {
    if (!(opts && opts.fromSwipe)) onceClass(el, idxOf(prev) < idx ? "enter-r" : "enter-l", 340);

/* 左右滑动切换标签：内容与高亮块都跟手 */
function initSwipe() {
  var el = $("#screens");
  if (!el) return;
  var start = null;
  el.addEventListener("pointerdown", function (e) {
    if (stack.length) return;
    if (e.pointerType === "mouse" && e.buttons !== 1) return;
    if (e.target.closest && e.target.closest(".tiles,.chips,input,textarea,select")) return;
    start = { x: e.clientX, y: e.clientY, i: idxOf(active), lock: null, dx: 0 };
  });
  el.addEventListener("pointermove", function (e) {
    if (!start) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (start.lock === null) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      start.lock = Math.abs(dx) > Math.abs(dy) * 1.25;
      if (!start.lock) { start = null; return; }
      el.style.transition = "none";
    }
    var i = start.i, max = TABS.length - 1;
    if ((i === 0 && dx > 0) || (i === max && dx < 0)) dx *= 0.3;
    start.dx = dx;
    var w = el.clientWidth || 1;
    el.style.transform = "translateX(calc(" + -i * 100 + "% + " + dx + "px))";
    moveIndicator(i + dx / w);
  });
  function end() {
    if (!start) return;
    var s = start; start = null;
    var w = el.clientWidth || 1;
    if (Math.abs(s.dx) > 8) swipeGuard = Date.now();
    var go = s.dx < -w * 0.24 ? 1 : s.dx > w * 0.24 ? -1 : 0;
    el.style.transition = "";
    var target = Math.max(0, Math.min(TABS.length - 1, s.i + go));
    if (target === s.i) {
      setTrack(s.i, 0, true);
      moveIndicator(s.i);
      syncTabbar();
    } else {
      switchTo(target, { fromSwipe: true });
    }
  }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
var swipeGuard = 0;

function renderPage(el, animate) {

  if (def.before) def.before(el, p);
  var body = def.html(p);

    ? body

  var next = el.querySelector(".page-scroll");

  if (def.after) def.after(el, p);

}

function applyPick(act, v) {
  if (act === "optCollege" || act === "optGrade" || act === "optCampus") {
    if (!draft) draftInit();
    if (act === "optCollege") draft.college = v;
    if (act === "optGrade") draft.grade = v;
    if (act === "optCampus") draft.campus = v;
    renderTop();
    return;
  }
  if (act === "optLang") { S.region.lang = v; document.documentElement.lang = v === "en" ? "en" : "zh-CN"; }
  else if (act === "optTz") S.region.tz = v;
  else if (act === "optDateFmt") S.region.dateFmt = v;
  else if (act === "optCurrency") S.region.currency = v;
  else if (act === "optDark") { S.theme = v; applyTheme(); }
  else if (act === "optVisible") S.privacy.visible = v;
  else if (act === "optDnd") S.settings.dnd = v;
  save(); refresh();
  if (act === "optLang") toast(v === "en" ? "Interface language set to English" : "界面语言已切换为简体中文");

}

function markRead(id) {

function shareAct(a, mode) {
  var url = location.href.split("#")[0] + "#" + a.id;
  var text = mode === "group"
    ? "【班级群转发】" + a.title + "\n时间：" + a.time + "\n地点：" + a.place + "\n报名还剩 " + left(a) + " 个名额，一起去吗？"
    : "我在「数字大外」看到一个活动：" + a.title + "，一起去吗？";
  var data = { title: a.title, text: text, url: url };
  if (mode !== "group" && navigator.share) {
    navigator.share(data).then(function () { toast("已分享，等同学来报名吧 🙌"); }).catch(function () {});
    return;
  }
  copyText(text + " " + url);
  toast(mode === "group" ? "转发文案已复制，粘贴到班级群即可" : "邀请文案已复制，发给同学即可");
}
function copyText(t) {
  try {
    if (navigator.clipboard) { navigator.clipboard.writeText(t); return; }
  } catch (e) {}
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function register(a) {
  var pctBefore = Math.round(joined(a) / a.quota * 100);
  S.reg[a.id] = true;
  S.todos.forEach(function (t) { if (t.act === a.id && !t.done) t.done = true; });
  var exists = S.todos.some(function (t) { return t.text.indexOf(a.title) >= 0; });
  if (!exists) {
    S.todos.unshift({ id: "t" + Date.now(), text: "参加 " + a.title, time: a.time + " · " + a.place, done: false, urgent: false, act: a.id });
  }
  if (!S.shares) S.shares = {};
  save(); vibrate(18); refresh();
  onceClass(findActive(".deadline"), "flash", 820);
  toast(pctBefore > 90 ? "报名成功！名额已超 90%，记得提醒同学尽快报名" : "报名成功！已加入日程，剩余 " + left(a) + " 个名额");
}
function unregister(a) {
  delete S.reg[a.id];
  S.todos = S.todos.filter(function (t) { return !(t.act === a.id && t.text.indexOf("参加") === 0); });
  save(); refresh(); toast("已取消报名");
}

document.addEventListener("click", function (e) {
  if (swipeGuard && Date.now() - swipeGuard < 380) return;   /* 刚滑过就别触发卡片点击 */
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var a = t.dataset.act;
  var id = t.dataset.id;
  vibrate(8);
  if (a === "tab") { showTab(t.dataset.k); return; }
  if (a === "back") { if (stack.length) history.back(); return; }
  if (a === "forum") { ui.forum = t.dataset.k; drawTab("home"); scrollMem.home = 0; return; }
  if (a === "cat") { ui.cat = t.dataset.k; drawTab("find"); return; }
  if (a === "follow") {
    var k = t.dataset.k;
    S.follows[k] = !isFollowed(k);
    save(); refresh();
    toast(S.follows[k] ? L("已关注 " + k + "，新活动会第一时间提醒你", "Following " + k) : L("已取消关注 " + k, "Unfollowed " + k));
    return;
  }
  /* ---- 我的 · 设置类动作 ---- */
  if (a === "pickAvatar") {
    if (!draft) draftInit();
    var av = sheet("<h3>" + L("选择头像", "Choose an avatar") + '</h3><div class="emo-pick">' + AVATARS.map(function (e) {
      return '<button class="' + (e === draft.emoji ? "on" : "") + '" data-e="' + e + '">' + e + "</button>";
    }).join("") + "</div>");
    $$("[data-e]", av.el).forEach(function (b) {
      b.addEventListener("click", function () {
        draft.emoji = b.dataset.e;
        av.close();
        var top = stack[stack.length - 1];
        if (top && top.dataset.name === "profile") renderPage(top); else { S.profile.emoji = draft.emoji; syncMe(); save(); refresh(); }
        toast(L("头像已更新", "Avatar updated"));
      });
    });
    return;
  }
  if (a === "draftSet") {
    if (!draft) draftInit();
    draft[t.dataset.k] = t.dataset.v;
    renderTop();
    return;
  }
  if (a === "draftReset") {
    draftInit(); renderTop(); toast(L("已撤销修改", "Changes discarded"));
    return;
  }
  if (a === "draftSave") {
    if (!draft) draftInit();
    if (!String(draft.name || "").trim()) { toast(L("昵称不能为空", "Nickname is required")); return; }

  if (a === "checkUpdate") { toast(L("已是最新版本 v3.2.0", "v3.2.0 is the latest version")); return; }
  if (a === "openDevices") { open("devices"); return; }
  if (a === "like") {
    var key = t.dataset.kind + ":" + id;
    if (S.likes[key]) delete S.likes[key]; else S.likes[key] = true;
    save(); refresh();
    if (S.likes[key]) {
      onceClass(findActive('[data-act="like"][data-kind="' + t.dataset.kind + '"][data-id="' + id + '"]'), "pop", 520);
      toast("已点赞，好的活动值得被更多同学看到");
    }
    return;
  }
  if (a === "lightbox") { lightbox(t.dataset.e); return; }
  if (a === "openAct") { openActivity(id); return; }
  if (a === "sharePost") { doSharePost(id); return; }
  if (a === "invite" || a === "shareGroup") { shareAct(act(id), a === "shareGroup" ? "group" : "invite"); return; }
  if (a === "actMore") {
    var ac = act(id);
    var s = sheet("<h3>" + esc(ac.title) + '</h3><p>' + esc(ac.host) + "</p>" +
      '<button class="sheet-btn" data-m="reg">' + (S.reg[ac.id] ? "取消报名" : "我要报名") + "</button>" +
      '<button class="sheet-btn ghostbtn" data-m="share">转发到班级群</button>' +
      '<button class="sheet-btn ghostbtn" data-m="todo">加入待办</button>');
    $("[data-m]", s.el).addEventListener("click", function (ev) {
      var m = ev.target.closest("[data-m]").dataset.m;
      s.close();
      if (m === "reg") S.reg[ac.id] ? unregister(ac) : register(ac);
      if (m === "share") shareAct(ac, "group");
      if (m === "todo") { S.todos.unshift({ id: "t" + Date.now(), text: "记得报名：" + ac.title, time: ac.deadline, done: false, urgent: true, act: ac.id }); save(); refresh(); toast("已加入待办"); }
    });
    return;
  }
  if (a === "reg") {
    var ac2 = act(id);
    if (S.reg[ac2.id]) {
      confirmSheet("取消报名", "取消后名额会释放给其他同学，确定取消吗？", "取消报名", function () { unregister(ac2); });
    } else {
      confirmSheet("确认报名", "<b>" + esc(ac2.title) + "</b><br>" + esc(ac2.time) + "<br>" + esc(ac2.place) + "<br><br>报名后会加入你的日程，并在截止前提醒你。", "确认报名", function () { register(ac2); });
    }
    return;
  }
  if (a === "submitCmt") { submitComment(t); return; }
  if (a === "focusCmt") {
    var inp = $("#cmt-input"); if (inp) { inp.focus(); toast("说点什么，让更多同学看到"); }
    return;
  }
  if (a === "mailbox") { open("mailList"); return; }
  if (a === "openMail") {
    markRead(id); open("mail", { id: id }); refresh();
    return;
  }
  if (a === "openMailFile") { toast("通知文件为演示内容"); return; }
  if (a === "readAll") {
    if (!unreadCount()) { toast("收件箱已全部读完"); return; }
    S.mails.forEach(function (m) { m.read = true; }); save(); refresh(); toast("已全部标记为已读");
    return;
  }
  if (a === "toggleTodo") {
    S.todos.forEach(function (x) { if (x.id === id) x.done = !x.done; });
    save(); refresh();
    var doneCount = S.todos.filter(function (x) { return x.done; }).length;
    if (doneCount === S.todos.length && S.todos.length) toast("今天的待办全部完成 🎉");
    return;
  }
  if (a === "addTodo") { addTodoSheet(); return; }
  if (a === "appTile") {
    var k = t.dataset.k;
    if (k === "mailbox") { open("mailList"); return; }
    if (k === "find") { showTab("find"); return; }
    if (k === "todo") { open("todo"); return; }
    if (k === "course" || k === "card" || k === "library" || k === "grades") { open(k); return; }
    if (k === "more") {
      var ms = sheet('<h3>更多应用</h3><p>全部应用 30+ · 长按图标可自定义排序</p><div class="app-grid" style="padding:14px 0 0">' +
        APPS.map(function (x) {
          return '<button class="app" data-close><span class="app-tile" style="background:linear-gradient(145deg,' + x.g[0] + "," + x.g[1] + ')">' + ico(x.i) + "</span><span>" + x.n + "</span></button>";
        }).join("") + "</div>");
      ms.el.addEventListener("click", function (ev) { if (ev.target.closest("[data-close]")) { ms.close(); toast("演示版本：该入口即将开放"); } });
      return;
    }
    toast("演示版本：该模块正在接入校园数据");
    return;
  }
  if (a === "todoSoon") { toast("演示版本：该模块正在接入校园数据"); return; }
  if (a === "open") {
    var n = t.dataset.k || id;
    if (n === "like") { open("collection"); return; }
    if (n === "schedule") { open("schedule"); return; }
    if (PAGES[n]) { open(n); return; }
    toast("演示版本：该模块正在接入校园数据");
    return;
  }
  if (a === "search") { open("search"); return; }
  if (a === "theme") {
    S.theme = S.theme === "dark" ? "light" : "dark";
    save(); applyTheme(); refresh();
    toast(S.theme === "dark" ? "已切换深色模式" : "已切换浅色模式");
    return;
  }
  if (a === "speed") { S.settings.speed = !S.settings.speed; save(); refresh(); toast(S.settings.speed ? "已开启极速模式" : "已关闭极速模式"); return; }
  if (a === "notice") { S.settings.notice = !S.settings.notice; save(); refresh(); toast(S.settings.notice ? "活动提醒已开启" : "活动提醒已关闭"); return; }
  if (a === "resetApp") {
    confirmSheet("恢复默认设置", "会清除本机的点赞、报名、待办等演示数据，确定继续吗？", "恢复默认", function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = loadState(); applyTheme(); refresh(); toast("已恢复默认数据");
    });
    return;
  }
  if (a === "renew") { toast("《" + t.dataset.k + "》已续借，到期日顺延 15 天"); return; }
  if (a === "soon") { toast("演示版本：" + t.dataset.k + " 即将开放"); return; }
  if (a === "logout") {
    confirmSheet("退出登录", "退出后需要重新使用学号登录，本机数据会保留。", "退出登录", function () { toast("已退出登录（演示版不会真的退出）"); });
    return;
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && stack.length) history.back();
  if (e.key === "Enter" && e.target && e.target.id === "cmt-input") {
    var btn = $('[data-act="submitCmt"]');
    if (btn) btn.click();
  }
});
function submitComment() {
  var inp = $("#cmt-input");
  if (!inp) return;
  var v = (inp.value || "").trim();
  if (!v) { toast("先写点什么吧"); inp.focus(); return; }
  var page = stack[stack.length - 1];
  var pid = page && page._params ? page._params.id : "a1";
  if (!S.comments[pid]) S.comments[pid] = [];
  S.comments[pid].unshift({ n: ME.name, e: ME.emoji, g: ["#FFB884", "#FF7A45"], t: v, l: 0, r: 0, time: "刚刚", mine: true });
  save();
  if (page) renderPage(page);
  onceClass(page ? page.querySelector(".cmt") : null, "cmt-new", 760);
  toast("评论已发布，同学都能看到啦 💬");
  vibrate(14);
}

/* ------------------------------ 启动 ------------------------------ */
function boot() {
  syncMe();
  applyTheme();
  applyFontSize();
  applyLite();
  document.documentElement.lang = S.region.lang === "en" ? "en" : "zh-CN";
  buildShell();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (S.theme === "auto") applyTheme();
    });
  } catch (e) {}
}
boot();
})();
</script>
</body>
</html>
